name: Publish to PyPI

on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Read version
      id: version
      run: |
        version=$(PYTHONPATH=src python -c "import vipps_api; print(vipps_api.__version__)")
        echo "value=$version" >> "$GITHUB_OUTPUT"
        status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/vipps-api/$version/json")
        echo "is_new=$([ "$status" = 404 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - name: Install
      if: steps.version.outputs.is_new == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
        pip install -e .
    - name: Test
      if: steps.version.outputs.is_new == 'true'
      run: pytest -q
    - name: Build
      if: steps.version.outputs.is_new == 'true'
      run: python -m build
    - name: Publish
      if: steps.version.outputs.is_new == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
