[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vipps-api"
description = "An implementation of Vipps-MobilePay API (Supports Report API)"
readme = "README.md"
license = "LicenseRef-Limfjords-Porter-Ware"
license-files = ["LICENSE"]
version = "0.1.0"

maintainers = [
    { name = "F-Klubben", email = "fit@fklub.dk" }
]

authors = [
    { name = "Falke Carlsen" },
    { name = "Kresten Laust", email = "kscker23@student.aau.dk" },
    { name = "Jonas B. Andersen" },
    { name = "Bo Andersen" },
    { name = "Asger Weirsøe" },
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

requires-python = ">= 3.10"

dependencies = [
    "requests>=2.24.0"
]

[project.urls]
Homepage = "https://github.com/f-klubben/vipps_api"
Repository = "https://github.com/f-klubben/vipps_api.git"
Issues = "https://github.com/f-klubben/vipps_api/issues"
